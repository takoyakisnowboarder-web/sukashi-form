# Codemagic CI/CD 設定
# Windows + Codemagic(macOS M2)+ iPhone で iOS をビルド・配信するための定義。
# App Store Connect の API キー連携名「たこ焼きスノーボーダー」を使って自動署名する。
#
# 使い方: Codemagic のビルド開始時にワークフロー「iOS TestFlight」を選ぶ。
# 完了すると署名付き IPA が TestFlight に自動アップロードされ、
# iPhone/iPad の TestFlight アプリで受け取れる。
#
# 署名方式: app-store-connect CLI で配布用証明書と App Store プロファイルを
# 明示的に「作成」する(--create)。
#
# 証明書の秘密鍵は Codemagic の環境変数 CERTIFICATE_PRIVATE_KEY(グループ ios_signing)
# に保存した固定の鍵を使う。これにより毎回同じ配布証明書が再利用される。
# ※ 以前はビルドのたびに鍵を生成していたため毎回新しい証明書が作られ、
#    Apple の上限(配布証明書は最大2つ)に達して 409 で失敗した。
# ※ 連携している API キーのロールは「App Manager」または「Admin」が必要。

workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # ↓ Codemagic に登録した App Store Connect API キーの「キー名」
      app_store_connect: たこ焼きスノーボーダー
    environment:
      groups:
        # CERTIFICATE_PRIVATE_KEY(配布証明書の秘密鍵)を含む環境変数グループ。
        # Codemagic の「環境変数」画面で secure として登録しておく。
        - ios_signing
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter パッケージ取得
        script: flutter pub get
      - name: キーチェーン初期化
        script: keychain initialize
      - name: 署名ファイルを取得・作成
        script: |
          # 固定の秘密鍵で配布用証明書と App Store プロファイルを取得(なければ作成)する。
          # 鍵が毎回同じなので、2回目以降は既存の証明書がそのまま再利用される。
          app-store-connect fetch-signing-files "com.sukashiform.sukashiForm" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: キーチェーンに証明書を登録
        script: keychain add-certificates
      - name: Xcode にプロファイルを適用
        script: xcode-project use-profiles
      - name: IPA ビルド
        script: |
          # ビルド番号を Codemagic のビルド連番にして、
          # TestFlight への再アップロードでも一意になるようにする。
          flutter build ipa --release \
            --build-name=1.0.11 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # アップロードのみ行う。内部テスター(自分)はBeta審査なしで即インストールできる。
        #
        # submit_to_testflight: true にすると「外部テスター向けベータ審査」への提出まで行うが、
        # それには App Store Connect 側でテスト情報の入力が必須(フィードバック用メール、
        # ベータ版アプリレビュー情報の氏名・電話番号・メール)。未入力だとこのステップで失敗する。
        # 外部テスター(最大10,000人)に配りたくなったら、下記URLでテスト情報を埋めてから true にする:
        #   https://appstoreconnect.apple.com/apps/6794272197/testflight/test-info
        submit_to_testflight: false

  # App Store 提出には iPhone 6.5インチ・iPad 13インチのスクリーンショットが必須だが、
  # 実機を持っていないため、Codemagic の Mac 上でシミュレータを起動して撮影する。
  # シミュレータ用ビルドは署名不要なので、上の ios-testflight とは独立して安全に実行できる。
  #
  # 使い方: このワークフロー「iOS Store Screenshots」でビルドを実行し、
  # 完了後にビルド詳細ページの Artifacts から screenshots/*.png をダウンロードして、
  # App Store Connect の該当サイズの欄へ手動でアップロードする。
  ios-store-screenshots:
    name: iOS Store Screenshots
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter パッケージ取得
        script: flutter pub get
      - name: シミュレータ向けにビルド(署名不要)
        script: flutter build ios --simulator --debug
      - name: シミュレータでスクリーンショットを撮影
        script: |
          set -e
          # simctl は相対パスの保存先を正しく解決できずに失敗するため、
          # スクリーンショットの入出力はすべて絶対パスで扱う。
          SHOTS="$PWD/screenshots"
          mkdir -p "$SHOTS"
          APP_PATH="$(find "$PWD/build/ios/iphonesimulator" -maxdepth 1 -name '*.app' | head -n1)"
          BUNDLE_ID="com.sukashiform.sukashiForm"
          echo "App path: $APP_PATH"
          echo "Screenshot dir: $SHOTS"

          # シミュレータの表示名は Mac の言語設定で変わる(例:「iPad Pro 13インチ (M5)」)。
          # 名前で探すと言語設定次第で失敗するため、locale 非依存の
          # deviceTypeIdentifier(例: ...SimDeviceType.iPad-Pro-13-inch-M5)で選ぶ。
          cat > /tmp/pick_device.py <<'PYEOF'
          import json
          import subprocess
          import sys

          want = sys.argv[1]
          data = json.loads(
              subprocess.check_output(
                  ["xcrun", "simctl", "list", "devices", "available", "--json"]
              )
          )

          def matches(ident):
              if want == "ipad13":
                  return "iPad" in ident and "13-inch" in ident
              if want == "iphonemax":
                  return "iPhone" in ident and "Pro-Max" in ident
              return False

          # 同じ機種が複数の iOS ランタイムに存在するので、最後に見つかったもの
          # (=より新しいランタイム側)を採用する。
          chosen = ""
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if matches(device.get("deviceTypeIdentifier", "")):
                      chosen = device["udid"]
          print(chosen)
          PYEOF

          capture() {
            label="$1"
            kind="$2"
            udid="$(python3 /tmp/pick_device.py "$kind")"
            if [ -z "$udid" ]; then
              echo "[$label] 条件 '$kind' に一致するシミュレータが見つかりません"
              echo "--- 利用可能なデバイス識別子 ---"
              xcrun simctl list devices available --json \
                | python3 -c "import json,sys;[print(d['deviceTypeIdentifier']) for r,ds in json.load(sys.stdin)['devices'].items() for d in ds]"
              return 1
            fi
            echo "[$label] シミュレータ $udid を使用します"
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "$APP_PATH"
            xcrun simctl launch "$udid" "$BUNDLE_ID"
            # Flutter のデバッグビルドは Dart VM の起動があるため初回描画が遅い
            sleep 20
            xcrun simctl io "$udid" screenshot --type=png "$SHOTS/${label}_raw.png"
            xcrun simctl shutdown "$udid" || true
            echo "[$label] 撮影サイズ: $(sips -g pixelWidth -g pixelHeight "$SHOTS/${label}_raw.png" | tail -n2 | tr '\n' ' ')"
          }

          capture "ipad" "ipad13"
          capture "iphone" "iphonemax"

          # App Store Connect が受け付ける画素数へ揃える(sips -z は 高さ 幅 の順)。
          #   iPad 13インチ : 2064 x 2752
          #   iPhone 6.9インチ: 1320 x 2868(撮影したそのままのサイズ)
          #   iPhone 6.5インチ: 1284 x 2778
          # ※ 6.5インチ相当の実機シミュレータは Xcode 26 世代に存在しない
          #   (iPhone 11 Pro Max などが削除済み)。そのため 6.9インチの撮影結果を
          #   6.5インチの規定画素数へ変換して用意する。縦横比の差は約0.4%で、
          #   見た目にはほぼ影響しない。
          sips -z 2752 2064 "$SHOTS/ipad_raw.png"   --out "$SHOTS/ipad_13inch_2064x2752.png"
          sips -z 2868 1320 "$SHOTS/iphone_raw.png" --out "$SHOTS/iphone_6.9inch_1320x2868.png"
          sips -z 2778 1284 "$SHOTS/iphone_raw.png" --out "$SHOTS/iphone_6.5inch_1284x2778.png"
          rm -f "$SHOTS/ipad_raw.png" "$SHOTS/iphone_raw.png"

          echo "=== 完成したスクリーンショット ==="
          for f in "$SHOTS"/*.png; do
            echo "$f : $(sips -g pixelWidth -g pixelHeight "$f" | tail -n2 | tr '\n' ' ')"
          done
    artifacts:
      - screenshots/*.png
