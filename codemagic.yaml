# Codemagic CI/CD 設定
# Windows + Codemagic(macOS M2)+ iPhone で iOS をビルド・配信するための定義。
# App Store Connect の API キー連携名「たこ焼きスノーボーダー」を使って自動署名する。
#
# 使い方: Codemagic のビルド開始時にワークフロー「iOS TestFlight」を選ぶ。
# 完了すると署名付き IPA が TestFlight に自動アップロードされ、
# iPhone/iPad の TestFlight アプリで受け取れる。
#
# 署名方式: app-store-connect CLI で配布用証明書と App Store プロファイルを
# 明示的に「作成」する(--create)。証明書作成には秘密鍵が必要なので、
# ビルド内で openssl で生成して --certificate-key に渡す。
# ※ 連携している API キーのロールは「App Manager」または「Admin」が必要。
# ※ 注意: このビルドは毎回新しい配布用証明書を作成する。Apple は配布用証明書を
#    最大2つまでしか持てないため、何度もビルドする段階になったら
#    秘密鍵を Codemagic の環境変数に保存して再利用する方式へ切り替えること。

workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # ↓ Codemagic に登録した App Store Connect API キーの「キー名」
      app_store_connect: たこ焼きスノーボーダー
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter パッケージ取得
        script: flutter pub get
      - name: キーチェーン初期化
        script: keychain initialize
      - name: 署名ファイルを取得・作成
        script: |
          # 証明書作成に使う秘密鍵を生成し、それを使って
          # 配布用証明書と App Store プロファイルを作成する。
          openssl genrsa -out /tmp/cert_key.pem 2048
          app-store-connect fetch-signing-files "com.sukashiform.sukashiForm" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
      - name: キーチェーンに証明書を登録
        script: keychain add-certificates
      - name: Xcode にプロファイルを適用
        script: xcode-project use-profiles
      - name: IPA ビルド
        script: |
          # ビルド番号を Codemagic のビルド連番にして、
          # TestFlight への再アップロードでも一意になるようにする。
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # アップロードのみ行う。内部テスター(自分)はBeta審査なしで即インストールできる。
        #
        # submit_to_testflight: true にすると「外部テスター向けベータ審査」への提出まで行うが、
        # それには App Store Connect 側でテスト情報の入力が必須(フィードバック用メール、
        # ベータ版アプリレビュー情報の氏名・電話番号・メール)。未入力だとこのステップで失敗する。
        # 外部テスター(最大10,000人)に配りたくなったら、下記URLでテスト情報を埋めてから true にする:
        #   https://appstoreconnect.apple.com/apps/6794272197/testflight/test-info
        submit_to_testflight: false
