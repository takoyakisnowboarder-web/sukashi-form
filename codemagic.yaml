# Codemagic CI/CD 設定
# Windows + Codemagic(macOS M2)+ iPhone で iOS をビルド・配信するための定義。
# App Store Connect の API キー連携名「たこ焼きスノーボーダー」を使って自動署名する。
#
# 使い方: Codemagic のビルド開始時にワークフロー「iOS TestFlight」を選ぶ。
# 完了すると署名付き IPA が TestFlight に自動アップロードされ、
# iPhone/iPad の TestFlight アプリで受け取れる。
#
# 署名は environment.ios_signing の自動ブロックではなく、
# app-store-connect CLI で証明書とプロファイルを明示的に「作成」する方式を採る
# (--create)。これによりプロファイル未存在でも自動生成される。
# ※ 連携している API キーのロールは「App Manager」または「Admin」が必要。
#    権限不足だと fetch-signing-files が権限エラーで失敗する。

workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # ↓ Codemagic に登録した App Store Connect API キーの「キー名」
      app_store_connect: たこ焼きスノーボーダー
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter パッケージ取得
        script: flutter pub get
      - name: 署名ファイルを取得・作成
        script: |
          app-store-connect fetch-signing-files "com.sukashiform.sukashiForm" \
            --type IOS_APP_STORE \
            --create
      - name: キーチェーンに証明書を登録
        script: |
          keychain initialize
          keychain add-certificates
      - name: Xcode にプロファイルを適用
        script: xcode-project use-profiles
      - name: IPA ビルド
        script: |
          # ビルド番号を Codemagic のビルド連番にして、
          # TestFlight への再アップロードでも一意になるようにする。
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # TestFlight に自動提出(内部テスターはBeta審査なしで即インストール可)。
        submit_to_testflight: true
