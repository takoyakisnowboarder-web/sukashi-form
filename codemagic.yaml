# Codemagic CI/CD 設定
# Windows + Codemagic(macOS M2)+ iPhone で iOS をビルド・配信するための定義。
# App Store Connect の API キー連携名「たこ焼きスノーボーダー」を使って自動署名する。
#
# 使い方: Codemagic のビルド開始時にワークフロー「iOS TestFlight」を選ぶ。
# 完了すると署名付き IPA が TestFlight に自動アップロードされ、
# iPhone/iPad の TestFlight アプリで受け取れる。
#
# 署名方式: app-store-connect CLI で配布用証明書と App Store プロファイルを
# 明示的に「作成」する(--create)。
#
# 証明書の秘密鍵は Codemagic の環境変数 CERTIFICATE_PRIVATE_KEY(グループ ios_signing)
# に保存した固定の鍵を使う。これにより毎回同じ配布証明書が再利用される。
# ※ 以前はビルドのたびに鍵を生成していたため毎回新しい証明書が作られ、
#    Apple の上限(配布証明書は最大2つ)に達して 409 で失敗した。
# ※ 連携している API キーのロールは「App Manager」または「Admin」が必要。

workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # ↓ Codemagic に登録した App Store Connect API キーの「キー名」
      app_store_connect: たこ焼きスノーボーダー
    environment:
      groups:
        # CERTIFICATE_PRIVATE_KEY(配布証明書の秘密鍵)を含む環境変数グループ。
        # Codemagic の「環境変数」画面で secure として登録しておく。
        - ios_signing
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter パッケージ取得
        script: flutter pub get
      - name: キーチェーン初期化
        script: keychain initialize
      - name: 署名ファイルを取得・作成
        script: |
          # 固定の秘密鍵で配布用証明書と App Store プロファイルを取得(なければ作成)する。
          # 鍵が毎回同じなので、2回目以降は既存の証明書がそのまま再利用される。
          app-store-connect fetch-signing-files "com.sukashiform.sukashiForm" \
            --type IOS_APP_STORE \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY \
            --create
      - name: キーチェーンに証明書を登録
        script: keychain add-certificates
      - name: Xcode にプロファイルを適用
        script: xcode-project use-profiles
      - name: IPA ビルド
        script: |
          # ビルド番号を Codemagic のビルド連番にして、
          # TestFlight への再アップロードでも一意になるようにする。
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # アップロードのみ行う。内部テスター(自分)はBeta審査なしで即インストールできる。
        #
        # submit_to_testflight: true にすると「外部テスター向けベータ審査」への提出まで行うが、
        # それには App Store Connect 側でテスト情報の入力が必須(フィードバック用メール、
        # ベータ版アプリレビュー情報の氏名・電話番号・メール)。未入力だとこのステップで失敗する。
        # 外部テスター(最大10,000人)に配りたくなったら、下記URLでテスト情報を埋めてから true にする:
        #   https://appstoreconnect.apple.com/apps/6794272197/testflight/test-info
        submit_to_testflight: false

  # App Store 提出には iPhone 6.5インチ・iPad 13インチのスクリーンショットが必須だが、
  # 実機を持っていないため、Codemagic の Mac 上でシミュレータを起動して撮影する。
  # シミュレータ用ビルドは署名不要なので、上の ios-testflight とは独立して安全に実行できる。
  #
  # 使い方: このワークフロー「iOS Store Screenshots」でビルドを実行し、
  # 完了後にビルド詳細ページの Artifacts から screenshots/*.png をダウンロードして、
  # App Store Connect の該当サイズの欄へ手動でアップロードする。
  ios-store-screenshots:
    name: iOS Store Screenshots
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Flutter パッケージ取得
        script: flutter pub get
      - name: シミュレータ向けにビルド(署名不要)
        script: flutter build ios --simulator --debug
      - name: シミュレータでスクリーンショットを撮影
        script: |
          set -e
          mkdir -p screenshots
          APP_PATH="$(find build/ios/iphonesimulator -maxdepth 1 -name '*.app' | head -n1)"
          BUNDLE_ID="com.sukashiform.sukashiForm"
          echo "App path: $APP_PATH"

          echo "=== 利用可能なシミュレータ一覧(デバッグ用) ==="
          xcrun simctl list devices available

          # 指定した名前の「既存の」シミュレータを検索し、UDID(識別子)を返す。
          # Codemagic の Mac にはあらかじめ主要な機種のシミュレータが用意されている。
          find_udid() {
            xcrun simctl list devices available \
              | grep -F "$1 (" \
              | head -n1 \
              | grep -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}'
          }

          # 候補名を順に試し、Xcodeのバージョンで名前が変わっていても対応できるようにする。
          capture_for() {
            local label="$1"; shift
            local udid=""
            local name=""
            for candidate in "$@"; do
              udid="$(find_udid "$candidate")"
              if [ -n "$udid" ]; then
                name="$candidate"
                break
              fi
            done
            if [ -z "$udid" ]; then
              echo "[$label] 一致するシミュレータが見つかりません(候補: $*)"
              return 1
            fi
            echo "[$label] '$name' ($udid) を使用します"
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl install "$udid" "$APP_PATH"
            xcrun simctl launch "$udid" "$BUNDLE_ID"
            sleep 6
            xcrun simctl io "$udid" screenshot "screenshots/${label}.png"
            xcrun simctl shutdown "$udid" || true
          }

          capture_for "ipad_13in_library" \
            "iPad Pro 13-inch (M4)" \
            "iPad Pro (12.9-inch) (6th generation)" \
            "iPad Pro (12.9-inch) (5th generation)"

          capture_for "iphone_65in_library" \
            "iPhone 11 Pro Max" \
            "iPhone Xs Max"

          echo "=== 撮影結果 ==="
          ls -la screenshots/
    artifacts:
      - screenshots/*.png
